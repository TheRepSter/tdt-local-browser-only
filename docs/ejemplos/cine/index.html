<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="color-scheme" content="dark">
  <title>Modo cine</title>
  <style>
    :root { color-scheme: dark; }
    html, body { margin: 0; height: 100%; }
    body {
      font: 14px/1.4 system-ui, sans-serif; color: #e9ece6;
      background: rgba(0, 0, 0, var(--osc, 0.7));
      display: flex; align-items: flex-end; justify-content: center;
    }
    #barra {
      display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
      margin: 0 0 18px; padding: 8px 14px; border-radius: 10px;
      background: rgba(10, 12, 11, .85); border: 1px solid #3a413d;
    }
    #que { font-weight: 600; }
    #que small { display: block; font-weight: 400; opacity: .75; }
    input[type="range"] { width: 110px; }
    button { font: inherit; cursor: pointer; background: #232826; color: #e9ece6; border: 1px solid #4a524d; border-radius: 6px; padding: 3px 10px; }
    .nota { font-size: 12px; opacity: .65; }
  </style>
</head>
<body>
  <div id="barra">
    <span id="que">Modo cine<small id="prog">…</small></span>
    <label>Vol <input type="range" id="vol" min="0" max="100" step="1" aria-label="Volumen"></label>
    <button id="mudo" type="button" aria-pressed="false">Sonido</button>
    <button id="salir" type="button">Salir del modo cine</button>
    <span class="nota">La pantalla se cierra con la ✕ de la cabecera del panel.</span>
  </div>
  <script src="/@tdt/sdk.js"></script>
  <script src="app.js"></script>
</body>
</html>
