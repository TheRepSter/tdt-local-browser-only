<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="color-scheme" content="light dark">
  <title>Agenda</title>
  <style>
    :root { color-scheme: light dark; }
    body { margin: 0; padding: 12px; font: 14px/1.4 system-ui, sans-serif; color: CanvasText; background: transparent; }
    h1 { margin: 0 0 8px; font-size: 18px; }
    .fila { display: flex; gap: 6px; margin-bottom: 8px; }
    input[type="search"] { flex: 1; font: inherit; }
    button { font: inherit; cursor: pointer; }
    ul { list-style: none; margin: 0; padding: 0; overflow-y: auto; max-height: 300px; }
    li { padding: 6px 4px; border-top: 1px solid color-mix(in srgb, CanvasText 15%, transparent); }
    .canal { font-weight: 600; cursor: pointer; }
    .prog { display: block; font-size: 13px; opacity: 0.85; }
    .star { float: right; background: none; border: none; font-size: 16px; }
    .marcado { color: #e8a020; }
    .vacio { opacity: 0.7; padding: 8px 4px; }
    #recordatorios { margin-top: 10px; font-size: 13px; }
    #recordatorios h2 { font-size: 14px; margin: 6px 0 4px; }
  </style>
</head>
<body>
  <h1>Agenda</h1>
  <div class="fila">
    <input type="search" id="buscar" placeholder="Añadir un canal a mi agenda…" aria-label="Buscar canal para añadir">
    <button id="add" type="button">Añadir</button>
  </div>
  <ul id="lista"></ul>
  <div id="recordatorios"></div>
  <script src="/@tdt/sdk.js"></script>
  <script src="app.js"></script>
</body>
</html>
