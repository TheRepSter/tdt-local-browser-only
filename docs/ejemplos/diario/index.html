<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="color-scheme" content="light dark">
  <title>Diario de tele</title>
  <style>
    :root { color-scheme: light dark; }
    body { margin: 0; padding: 12px; font: 14px/1.4 system-ui, sans-serif; color: CanvasText; background: transparent; }
    h1 { margin: 0 0 8px; font-size: 18px; }
    h2 { font-size: 14px; margin: 10px 0 4px; }
    .fila { display: flex; gap: 6px; margin-top: 10px; }
    button { font: inherit; cursor: pointer; }
    ul { list-style: none; margin: 0; padding: 0; overflow-y: auto; max-height: 210px; }
    li { padding: 5px 4px; border-top: 1px solid color-mix(in srgb, CanvasText 15%, transparent); }
    .bar { height: 6px; border-radius: 3px; background: #4a90d9; margin-top: 2px; }
    .bar-fondo { background: color-mix(in srgb, CanvasText 12%, transparent); border-radius: 3px; }
    .top { display: flex; justify-content: space-between; gap: 8px; }
    .vacio { opacity: 0.7; padding: 8px 4px; }
    .entry { display: flex; justify-content: space-between; gap: 8px; font-size: 13px; }
    .entry .dur { opacity: 0.75; white-space: nowrap; }
    #resumen { font-size: 13px; opacity: 0.9; }
  </style>
</head>
<body>
  <h1>Diario de tele</h1>
  <div id="resumen"></div>
  <h2>Canales que más ves</h2>
  <ul id="top"></ul>
  <h2>Últimos cambios de canal</h2>
  <ul id="lista"></ul>
  <div class="fila">
    <button id="exportar" type="button">Exportar JSON</button>
    <button id="borrar" type="button">Borrar el diario</button>
  </div>
  <script src="/@tdt/sdk.js"></script>
  <script src="app.js"></script>
</body>
</html>
